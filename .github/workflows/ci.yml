name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # No global RUSTFLAGS=-D warnings: it reaches dependencies too, so a warning
  # in a third-party crate would fail the build. The `lint` job is the warning
  # gate, where `-D warnings` applies to workspace crates only.

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Build the web UI bundle so it exists on disk; a smoke test asserts
      # the server serves a dist bundle with SPA fallback.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build web UI
        run: |
          cd crates/aegis-web
          npm ci || npm install
          npm run build
      # aegis-desktop's cdylib needs Tauri system libs; it's built in the
      # dedicated desktop job, not here.
      - run: cargo build --workspace --exclude aegis-desktop --all-targets
      - run: cargo test --workspace --exclude aegis-desktop

  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # aegis-desktop is excluded here exactly as in the test job: its
      # cdylib needs Tauri's system libraries (glib/webkit2gtk), which only
      # the `desktop` job installs.
      - run: cargo clippy --workspace --exclude aegis-desktop --all-targets -- -D warnings

  # The benchmark suite must always compile and run; criterion baselines are
  # not persisted across runs (no dedicated bench runner), so this job acts
  # as a smoke test for the benchmarks rather than a regression gate.
  # Comparisons against docs/11-performance-targets.md happen on demand:
  #   cargo bench -p aegis-core -- --save-baseline main
  bench:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Benchmarks need the optimized build of every dependency; cache
          # them separately from the test job's debug artifacts.
          key: bench
      - run: cargo bench --workspace --exclude aegis-desktop --no-run
      - name: Smoke-run benchmarks (reduced sampling)
        run: cargo bench -p aegis-core --bench bench -- --warm-up-time 0.2 --measurement-time 0.8

  # Phase 2: the agentless path against a REAL sshd (the in-process russh
  # server covers hermetic runs; this job validates against stock OpenSSH).
  docker-tests:
    name: real sshd (docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: docker-tests
      - run: cargo test -p aegis-core --test real_sshd
        env:
          AEGIS_DOCKER_TESTS: "1"

  # Phase 4: Playwright E2E over the real server + real UI. A test binary
  # harness boots an aegis-server against the in-process SSH server and
  # seeds an admin; Playwright then drives the browser through the flows.
  e2e:
    name: e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: e2e
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build server + seed harness
        run: cargo build -p aegis-server -p aegis-cli
      - name: Start aegis-server with an in-process SSH target
        run: |
          bash scripts/e2e-harness.sh &
          # The harness does two Argon2id derivations per process before it
          # listens, so poll /health instead of sleeping a guessed interval.
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then
              echo "server is up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "aegis-server never became healthy" >&2
          exit 1
        env:
          AEGIS_PASSPHRASE: e2e-passphrase
      - name: Run Playwright
        working-directory: crates/aegis-web
        # No `playwright install`: the config drives the system Chrome
        # (`channel: 'chrome'`), which the ubuntu runner image ships.
        run: |
          npm ci || npm install
          npx playwright test
        env:
          CI: "1"
          AEGIS_E2E_API: http://127.0.0.1:8080
          AEGIS_E2E_SSH_PORT: 2222
          # The in-process sshd only accepts this user (aegis-core's
          # tests/sftp_server.rs harness); any other name fails auth.
          AEGIS_E2E_SSH_USER: aegis-test
          AEGIS_E2E_PATHS: /srv/backup-me
          AEGIS_E2E_REPO: /tmp/aegis-e2e-repo

  # Phase 5: the Tauri desktop shell compiles and bundles (msi/appimage/deb).
  # The sidecar aegis-server binary is built in-job and copied into place by
  # scripts/build-desktop.sh.
  desktop:
    name: desktop bundle (tauri)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.os }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Tauri system deps (linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - name: Install web dependencies
        working-directory: crates/aegis-web
        # build-desktop.sh runs `npm run build` (tsc + vite) and `npx tauri
        # build`; without node_modules both fail on a clean checkout.
        run: npm ci || npm install
      - name: Build desktop bundle
        run: bash scripts/build-desktop.sh
        env:
          RELEASE: "1"
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: aegis-desktop-linux
          path: target/release/bundle/*/*.{AppImage,deb}
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: aegis-desktop-windows
          path: target/release/bundle/msi/*.msi
          if-no-files-found: warn
