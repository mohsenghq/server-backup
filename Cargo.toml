[workspace]
resolver = "2"
members = [
    "crates/aegis-core",
    "crates/aegis-cli",
    "crates/aegis-server",
    "crates/aegis-agent",
    "crates/aegis-mcp",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/mohsenghq/aegis"

[workspace.dependencies]
# `ring` instead of the default `aws-lc-rs`: aws-lc-sys needs NASM/CMake to
# build on Windows, ring ships pregenerated assembly.
russh = { version = "0.63.2", default-features = false, features = ["ring", "rsa", "flate2"] }
russh-sftp = "2.4.0"
aegis-core = { path = "crates/aegis-core" }

anyhow = "1"
argon2 = { version = "0.5", features = ["std"] }
async-trait = "0.1"
atty = "0.2"
base64 = "0.22"
blake3 = "1"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
fastcdc = { version = "5", features = ["tokio"] }
filetime = "0.2"
getrandom = "0.3"
hostname = "0.4"
axum = { version = "0.8", features = ["ws"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde-well-known"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal"] }
tokio-cron-scheduler = "0.14"
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
zstd = "0.13"

tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
