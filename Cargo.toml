[workspace]
resolver = "2"
members = [
    "crates/aegis-core",
    "crates/aegis-cli",
    "crates/aegis-server",
    "crates/aegis-agent",
    "crates/aegis-mcp",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
repository = "https://github.com/mohsenghq/aegis"

[workspace.dependencies]
aegis-core = { path = "crates/aegis-core" }

anyhow = "1"
async-trait = "0.1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
fastcdc = "5"
hostname = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde-well-known"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

tempfile = "3"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
