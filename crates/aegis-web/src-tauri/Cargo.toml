[package]
name = "aegis-desktop"
description = "Aegis desktop shell: the aegis-web UI with a local aegis-server sidecar."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
rust-version = "1.77.2"

[lib]
name = "aegis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3" }

[dependencies]
serde_json.workspace = true
serde.workspace = true
log = "0.4"
tauri = { version = "2.11.6" }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tokio.workspace = true
aegis-core.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json"] }

[features]
# Tauri's mobile entry point needs this knob; desktop builds leave it off.
default = []
